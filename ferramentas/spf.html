    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0c0f; --surface: #13171c; --surface2: #1c2128;
            --border: #2a303a; --text: #edf0f5; --muted: #8b95a8;
            --purple: #b893f4; --purple-dark: #7a53b0; --teal: #6cd4c6;
            --blue: #4a90e2; --blue-dark: #357abd;
            --shadow: 0 12px 48px rgba(0,0,0,0.7); --radius: 16px;
            --radius-sm: 12px; --font: 'Inter', system-ui, -apple-system, sans-serif;
        }
        body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
        
        .screen { display: none; height: 100vh; overflow-y: auto; padding-bottom: 40px; scroll-behavior: smooth; }
        .screen.active { display: flex; flex-direction: column; }
        
        header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(10,12,15,0.85); backdrop-filter: blur(14px);
            padding: 16px 24px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 12px; flex-shrink: 0;
        }
        
        header h1 {
            font-size: 20px; font-weight: 700;
            background: linear-gradient(135deg, var(--purple), var(--teal));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .mode-11 header h1 {
            background: linear-gradient(135deg, var(--blue), var(--teal));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        header .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
        
        main { flex: 1; padding: 24px 20px; max-width: 720px; margin: 0 auto; width: 100%; }
        
        /* Seletor de Modo */
        .mode-selector {
            display: flex; background: var(--surface); border-radius: var(--radius-sm); padding: 4px;
            margin-bottom: 24px; border: 1px solid var(--border);
        }
        .mode-btn {
            flex: 1; padding: 12px; background: transparent; border: none;
            color: var(--muted); font-size: 14px; font-weight: 600; border-radius: 8px;
            cursor: pointer; transition: all 0.2s; font-family: var(--font);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .mode-btn.active[data-mode="7.1"] { background: var(--purple-dark); color: #fff; box-shadow: 0 4px 12px rgba(183,148,244,0.3); }
        .mode-btn.active[data-mode="11.0"] { background: var(--blue-dark); color: #fff; box-shadow: 0 4px 12px rgba(74,144,226,0.3); }

        .field-group { margin-bottom: 22px; }
        .field-group label { display: block; font-size: 13px; font-weight: 500; color: var(--purple); margin-bottom: 6px; letter-spacing: 0.3px; transition: color 0.3s; }
        .mode-11 .field-group label { color: var(--blue); }
        .field-group select {
            width: 100%; padding: 14px 16px; background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-sm); color: var(--text); font-size: 15px;
            font-family: var(--font); outline: none; transition: border 0.25s, box-shadow 0.25s;
            appearance: none; cursor: pointer;
        }
        .field-group select:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(183,148,244,0.15); }
        .mode-11 .field-group select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(74,144,226,0.15); }
        
        .fab-generate {
            width: 100%; padding: 18px 24px; background: linear-gradient(135deg, var(--purple), var(--purple-dark));
            color: #0a0c0f; border: none; border-radius: var(--radius); font-size: 16px; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            box-shadow: 0 8px 32px rgba(183,148,244,0.25); cursor: pointer;
            transition: all 0.3s; letter-spacing: 0.5px; margin-top: 10px;
        }
        .mode-11 .fab-generate { background: linear-gradient(135deg, var(--blue), var(--blue-dark)); box-shadow: 0 8px 32px rgba(74,144,226,0.25); }
        .fab-generate:hover { filter: brightness(1.1); }
        .fab-generate:active { transform: scale(0.98); }

        /* Estilos da Lista de Resultados (Um embaixo do outro) */
        .section-title {
            font-size: 13px; font-weight: 700; color: var(--purple); margin: 24px 0 8px 8px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .mode-11 .section-title { color: var(--blue); }
        .section-title:first-child { margin-top: 0; }

        .result-grid { display: flex; flex-direction: column; gap: 8px; }
        .result-item { 
            position: relative; display: flex; flex-direction: column; justify-content: center;
            padding: 12px 16px; background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius-sm); cursor: pointer; transition: background 0.2s, border-color 0.2s; 
        }
        .result-item:hover { background: var(--surface2); border-color: var(--purple-dark); }
        .mode-11 .result-item:hover { border-color: var(--blue-dark); }
        
        .result-item .label { font-size: 12px; color: var(--muted); font-weight: 500; margin-bottom: 4px; }
        .result-item .value { 
            font-size: 15px; font-weight: 500; font-family: 'Monaco','Menlo','Cascadia Code',monospace; 
            color: var(--text); word-break: break-all; padding-right: 24px;
        }
        .result-item .copy-icon { 
            position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
            font-size: 18px; color: var(--muted); opacity: 0.3; transition: opacity 0.2s; 
        }
        .result-item:hover .copy-icon { opacity: 1; color: var(--purple); }
        .mode-11 .result-item:hover .copy-icon { color: var(--blue); }

        /* Botões de Ação na Tela de Resultado */
        .action-buttons {
            display: flex; flex-direction: column; gap: 12px; margin-top: 32px;
        }
        .action-btn {
            width: 100%; padding: 16px; border: none; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 700; font-family: var(--font); cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.2s;
        }
        .btn-copy { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
        .btn-copy:hover { background: #252b36; }
        
        .btn-new { background: var(--purple-dark); color: #fff; }
        .mode-11 .btn-new { background: var(--blue-dark); }
        .btn-new:hover { filter: brightness(1.1); }

        .btn-back { background: transparent; color: var(--muted); border: 1px solid var(--border); }
        .btn-back:hover { background: var(--surface); color: var(--text); }

        .toast { 
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px); 
            background: var(--surface2); color: var(--text); padding: 12px 24px; border-radius: 50px; 
            font-size: 14px; font-weight: 500; box-shadow: var(--shadow); opacity: 0; pointer-events: none; 
            transition: opacity 0.3s, transform 0.3s; z-index: 100; border: 1px solid var(--border); 
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        
        .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid rgba(10,12,15,0.2); border-top-color: #0a0c0f; border-radius: 50%; animation: spin 0.7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

        @media (max-width: 480px) {
            main { padding: 16px; }
            header h1 { font-size: 18px; }
        }
    </style>

        let xorshiftState0 = 0xCAFEBABE ^ Date.now();
        let xorshiftState1 = 0xDEADBEEF ^ (Date.now() >>> 32);
        
        function xorshift128() {
            let s1 = xorshiftState0;
            let s0 = xorshiftState1;
            xorshiftState0 = s0;
            s1 ^= s1 << 23;
            s1 ^= s1 >> 17;
            s1 ^= s0 ^ (s0 >> 26);
            xorshiftState1 = s1;
            return (s0 + s1) >>> 0;
        }
        
        function randomInt(min, max) { return min + (xorshift128() % (max - min + 1)); }

        function weightedRandom(items, weights) {
            const totalWeight = weights.reduce((sum, w) => sum + w, 0);
            let random = xorshift128() % totalWeight;
            for (let i = 0; i < items.length; i++) {
                if (random < weights[i]) return items[i];
                random -= weights[i];
            }
            return items[0];

                    buildNumber = `NMF26X`;
                    const miuiVersion = `V9.${randomInt(2,6)}.${randomInt(1,5)}.0.N${randomItem(['CA','MB','MH'])}MIEK`;
                    fingerprint = `Xiaomi/${modelData.product}/${modelData.device}:${androidVer}/NMF26X/${miuiVersion}:user/release-keys`;
                    baseband = `AT3.1.c4-00109-${modelData.board.replace('msm', '')}_GEN_PACK-1`;
                }
            } else {
                securityPatch = `${randomItem([2020, 2021, 2022])}-${String(randomInt(1,12)).padStart(2,'0')}-${String(randomItem([1, 5])).padStart(2,'0')}`;
                if (manufacturer === 'Samsung') {
                    const shortBuild = `XXU${randomInt(1,5)}C${randomString(2,'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789')}`;
                    buildNumber = `RP1A.200720.012.${modelData.baseband}${shortBuild}`;
                    fingerprint = `samsung/${modelData.product}/${modelData.device}:${androidVer}/RP1A.200720.012/${modelData.baseband}${shortBuild}:user/release-keys`;
                    baseband = `${modelData.model.replace(/\D/g,'')}XXU${randomInt(1,5)}C${randomString(2,'A-Z0-9')}`;
                } else if (manufacturer === 'Motorola') {
                    buildNumber = `RRQ31.Q3-68-${randomInt(10, 50)}`;
                    fingerprint = `motorola/${modelData.product}/${modelData.device}:${androidVer}/${buildNumber}/${randomInt(1,9)}:user/release-keys`;
                    baseband = `${modelData.board.replace('sm', 'M')}_11.${randomInt(30,70)}.${randomInt(10,25)}R`;
                } else if (manufacturer === 'Xiaomi') {
                    buildNumber = `RKQ1.200826.002`;
                    const miuiVersion = `V12.${randomInt(0,5)}.${randomInt(1,9)}.0.R${randomItem(['JB','KF','KG'])}MIXM`;
                    fingerprint = `Xiaomi/${modelData.product}/${modelData.device}:${androidVer}/${buildNumber}/${miuiVersion}:user/release-keys`;
                    baseband = `4.3.c5-00123-${modelData.board.replace('sm', '')}_GEN_PACK-1`;
                } else {
                    buildNumber = `RQ3A.211001.001`;
                    fingerprint = `google/${modelData.product}/${modelData.device}:${androidVer}/${buildNumber}/7641976:user/release-keys`;
                    baseband = `g7150-00047-210901-B-7696615`;
                }
            }
            return { buildNumber, fingerprint, securityPatch, baseband };
        }

        function generateSSID(carrier) {
            const patterns = {
                VIVO:   [{prefix: 'Vivo', suffix: ['', '_CASA', '_FAMILIA'], weights: [50,30,20]}],
                CLARO:  [{prefix: 'Claro', suffix: ['', '_RESIDENCIAL', '_EMPRESARIAL'], weights: [45,30,25]}],
                TIM:    [{prefix: 'TIM', suffix: ['', '_LIVE', '_FIBRA'], weights: [50,30,20]}],
                OI:     [{prefix: 'Oi', suffix: ['', '_FIBRA', '_WIFI'], weights: [50,30,20]}],
                NEXTEL: [{prefix: 'Nextel', suffix: ['', '_WiFi'], weights: [70,30]}],
            };
            const p = patterns[carrier] || [{prefix: carrier, suffix: [''], weights: [100]}];
            let finalSSID = p[0].prefix + p[0].suffix[xorshift128() % p[0].suffix.length];
            if (xorshift128() % 100 < 40) finalSSID += `_${randomInt(1, 999)}`;
            if (currentMode === "11.0" && xorshift128() % 100 < 60) finalSSID += '_5G';
            return finalSSID;
        }

        function generateCarrierCode(carrier) {
            const plmnData = {
                VIVO:   [{code:'72404',name:'Vivo'},{code:'72400',name:'Vivo'}],
                CLARO:  [{code:'72405',name:'Claro'},{code:'72406',name:'Claro'}],
                TIM:    [{code:'72410',name:'TIM'},{code:'72411',name:'TIM'}],
                OI:     [{code:'72415',name:'Oi'},{code:'72416',name:'Oi Móvel'}],
                NEXTEL: [{code:'72423',name:'Nextel'},{code:'72439',name:'Nextel'}],
            };
            const opts = plmnData[carrier] || [{code:'72499',name:carrier}];
            return `${opts[0].code} ${opts[0].name}`;
        }

        function generateData() {
            const carrier      = document.getElementById('carrier').value;
            const manufacturer = document.getElementById('manufacturer').value;
            const modelCode    = document.getElementById('modelSelect').value;
            
            const list = deviceDB[currentMode][manufacturer] || [];
            let modelData = list.find(m => m.model === modelCode) || randomItem(list);
            if (!modelData) throw new Error('Nenhum modelo compatível encontrado.');
            
            xorshiftState0 = 0xCAFEBABE ^ Date.now() ^ (Math.random() * 0xFFFFFFFF);
            xorshiftState1 = 0xDEADBEEF ^ (Date.now() >>> 32) ^ (Math.random() * 0xFFFFFFFF);
            
            const sysData = getBuildAndFingerprint(modelData, manufacturer);
            
            let phoneType = weightedRandom(['GSM/LTE', 'GSM/UMTS'], [70, 30]);
            let networkType = weightedRandom(['LTE', 'LTE-A', 'HSPA+'], [50, 30, 20]);
            
            if (currentMode === "11.0") {
                phoneType = weightedRandom(['GSM/LTE', 'GSM/5G NR'], [60, 40]);
                networkType = weightedRandom(['LTE-A', '5G NR NSA', 'LTE'], [50, 30, 20]);
            }
            
            let kernelVersion = currentMode === "7.1" 
                ? `${randomItem(['3.18','4.4'])}.${randomInt(10, 140)}-g${randomHex(7)}`
                : `${randomItem(['4.14','4.19', '5.4'])}.${randomInt(100, 250)}-g${randomHex(10)}`;
            
            let totalMem = randomItem(currentMode === "11.0" ? [6, 8, 12] : [3, 4, 6]);
            let totalSto = randomItem(currentMode === "11.0" ? [128, 256] : [32, 64, 128]);
            
            let mockMd5 = ''; for(let i=0; i<32; i++) mockMd5 += '0123456789abcdef'.charAt(xorshift128() % 16);
            
            return {
                model: modelData.model, brand: manufacturer, product: modelData.product, device: modelData.device, 
                board: modelData.board, manufacturer: manufacturer,
                serial: generateSerial(), androidId: generateAndroidId(), 
                imei: generateIMEI(manufacturer), svn: String(randomInt(currentMode === "11.0" ? 10 : 0, 20)).padStart(2, '0'),
                baseband: sysData.baseband, sim: 'Inserido', carrier: generateCarrierCode(carrier),
                networkType, signal: `-72 dBm`, networkStatus: 'Registrado',
                ssid: generateSSID(carrier), bssid: randomMac(), ip: randomIP(), mac: randomMac(),
                androidVersion: currentMode === "7.1" ? "7.1.1" : "11", apiLevel: currentMode === "7.1" ? 25 : 30, 
                phoneType, buildNumber: sysData.buildNumber, securityPatch: sysData.securityPatch, 
                fingerprint: sysData.fingerprint, kernelVersion,
                bootloader: manufacturer === 'Samsung' ? sysData.buildNumber.split('.').pop() : `0x${randomHex(4).toUpperCase()}`, 
                radioVersion: sysData.baseband.split('_')[0] || sysData.baseband,
                gpsLocation: { latitude: (-23.5505 + (Math.random()-0.5)).toFixed(6), longitude: (-46.6333 + (Math.random()-0.5)).toFixed(6) },
                cellTower: { mcc: 724, mnc: 4, cid: randomInt(1,1000000), lac: randomInt(1,10000) },
                batteryLevel: `${randomInt(15, 98)}%`, screenResolution: `${randomItem([1080, 1440])}x${randomItem([1920, 2400, 3200])}`, 
                totalMemory: `${totalMem} GB`, deviceHash: mockMd5
            };
        }

        // ============================================================
        //  RENDERIZAÇÃO
        // ============================================================
        function renderResult(data) {
            const container = document.getElementById('resultContent');

            const sections = {
                'Identificação e Aparelho': [
                    {label:'Model', key:'model'},
                    {label:'Brand / Manufacturer', key:'brand'},
                    {label:'Product Name', key:'product'},
                    {label:'Device Name', key:'device'},
                    {label:'Hardware (Board)', key:'board'},
                    {label:'Número Serial', key:'serial'},
                    {label:'Android ID', key:'androidId'},
                    {label:'Device Hash', key:'deviceHash'}
                ],
                'Telefonia e Operadora': [
                    {label:'Phone Type', key:'phoneType'},
                    {label:'IMEI', key:'imeiDisplay'},
                    {label:'Mobile Carrier', key:'carrier'},
                    {label:'Network Type', key:'networkType'},
                    {label:'Signal Strength', key:'signal'},
                ],
                'Rede WiFi e IP': [
                    {label:'SSID WiFi', key:'ssid'},
                    {label:'BSSID WiFi', key:'bssid'},
                    {label:'Endereço IP NIC', key:'ip'},
                    {label:'Endereço MAC NIC', key:'mac'},
                ],
                'Software e Sistema': [
                    {label:'Android Version', key:'androidVersion'},
                    {label:'API Level', key:'apiLevel'},
                    {label:'Build Number', key:'buildNumber'},
                    {label:'Security Patch', key:'securityPatch'},
                    {label:'Fingerprint', key:'fingerprint'},
                    {label:'Baseband / Radio', key:'baseband'},
                    {label:'Kernel Version', key:'kernelVersion'},
                    {label:'Bootloader', key:'bootloader'},
                ],
                'Sensores e Extras': [
                    {label:'GPS Latitude', key:'gpsLocation.latitude'},
                    {label:'GPS Longitude', key:'gpsLocation.longitude'},
                    {label:'MCC / MNC', key:'cellMccMnc'},
                    {label:'Nível Bateria', key:'batteryLevel'},
                    {label:'Resolução Tela', key:'screenResolution'},
                    {label:'Memória Total', key:'totalMemory'},
                ]
            };

            let html = '';
            
            for (const [sectionName, fields] of Object.entries(sections)) {
                html += `<div class="section-title">${sectionName}</div>`;
                html += `<div class="result-grid">`;
                
                fields.forEach(f => {
                    let v;
                    if (f.key === 'imeiDisplay') v = `${data.imei} ${data.svn}`;
                    else if (f.key === 'cellMccMnc') v = `${data.cellTower.mcc} / ${data.cellTower.mnc}`;
                    else if (f.key.includes('.')) {
                        const keys = f.key.split('.');
                        v = keys.reduce((obj, key) => obj && obj[key], data) ?? '—';
                    } else v = data[f.key] ?? '—';
                    
                    html += `
                    <div class="result-item" data-value="${v}" onclick="copyValue(this)">
                        <span class="label">${f.label}</span>
                        <span class="value">${v}</span>
                        <span class="copy-icon material-icons-round">content_copy</span>
                    </div>`;
                });
                
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        // ============================================================
        //  CONTROLES DE INTERFACE
        // ============================================================
        
        function populateManufacturers() {
            const mfgSelect = document.getElementById('manufacturer');
            mfgSelect.innerHTML = '';
            Object.keys(deviceDB[currentMode]).forEach(mfg => {
                const opt = document.createElement('option');
                opt.value = mfg;
                opt.textContent = mfg === 'Xiaomi' ? (currentMode === '11.0' ? 'Xiaomi / POCO / Redmi' : 'Xiaomi / Redmi') : mfg;
                mfgSelect.appendChild(opt);
            });
            populateModels();
        }

        function populateModels() {
            const mfg = document.getElementById('manufacturer').value;
            const sel = document.getElementById('modelSelect');
            sel.innerHTML = '<option value="any">Qualquer modelo compatível</option>';
            if (deviceDB[currentMode][mfg]) {
                deviceDB[currentMode][mfg].forEach(d => {
                    const o = document.createElement('option');
                    o.value = d.model;
                    o.textContent = d.name;
                    sel.appendChild(o);
                });
            }
        }

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                currentMode = this.dataset.mode;
                document.body.className = `mode-${currentMode.replace('.', '')}`;
                
                const btnText = document.getElementById('btnText');
                const headerSub = document.getElementById('headerSub');
                const headerIcon = document.getElementById('headerIcon');
                
                if (currentMode === "7.1") {
                    btnText.textContent = "GERAR IDENTIDADE NOUGAT";
                    headerSub.textContent = "Sandbox Nougat 7.1";
                    headerIcon.style.color = "var(--purple)";
                } else {
                    btnText.textContent = "GERAR IDENTIDADE ANDROID 11";
                    headerSub.textContent = "Sandbox Red Velvet Cake 11.0";
                    headerIcon.style.color = "var(--blue)";
                }
                populateManufacturers();
            });
        });

        function copyValue(el) {
            const v = el.dataset.value;
            if (!v) return;
            navigator.clipboard.writeText(v).catch(() => {
                const t = document.createElement('textarea');
                t.value = v; document.body.appendChild(t); t.select();
                document.execCommand('copy'); document.body.removeChild(t);
            }).finally(() => showToast('Copiado: ' + v));
        }

        function copyAllData() {
            let text = '';
            document.querySelectorAll('.result-item').forEach(el => {
                const lbl = el.querySelector('.label')?.textContent || '';
                const val = el.dataset.value || '';
                if (lbl && val) text += `${lbl.toUpperCase()}: ${val}\n`;
            });
            if (!text) return;
            navigator.clipboard.writeText(text).catch(() => {
                const t = document.createElement('textarea');
                t.value = text; document.body.appendChild(t); t.select();
                document.execCommand('copy'); document.body.removeChild(t);
            }).finally(() => showToast('Todos os dados copiados!'));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._t);
            toast._t = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0, 0); // Volta ao topo da tela
        }

        function doGenerate() {
            const data = generateData();
            if (data) {
                renderResult(data);
                showScreen('screen-result');
                showToast(`Identidade gerada com sucesso!`);
            }
        }

        document.getElementById('manufacturer').addEventListener('change', populateModels);

        document.getElementById('btnForge').addEventListener('click', function () {
            const btn = this;
            const originalText = document.getElementById('btnText').textContent;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> <span>Gerando...</span>';
            
            setTimeout(() => {
                try { doGenerate(); } 
                catch (error) { showToast('Erro: ' + error.message); } 
                finally {
                    btn.disabled = false;
                    btn.innerHTML = `<span class="material-icons-round">sync_alt</span> <span id="btnText">${originalText}</span>`;
                }
            }, 700);
        });

        // Botões da tela de resultado
        document.getElementById('btnCopyAll').addEventListener('click', copyAllData);
        document.getElementById('btnRegenerate').addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(doGenerate, 300);
        });
        document.getElementById('btnBack').addEventListener('click', () => showScreen('screen-setup'));

        // Inicialização
        populateManufacturers();
    </script>
</body>
</html>
