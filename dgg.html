<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHKR.CC - Automatização Scraping</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }

        body {
            background: #1a1b1e;
            color: #e1e1e1;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }

        textarea {
            background: #222;
            color: #0f0;
            border: 1px solid #444;
            padding: 10px;
            width: 100%;
            height: 200px;
            font-family: monospace;
            resize: none;
            line-height: 1.4;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .btn {
            background: #333;
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn:hover {
            background: #444;
        }

        .btn.active {
            background: #20b27c;
        }

        .btn-danger {
            background: #ff014f;
        }

        .btn-primary {
            background: #3498db;
        }

        .tabs {
            display: flex;
            gap: 5px;
            margin-top: 20px;
        }

        .tab {
            padding: 10px 20px;
            background: #222;
            border: none;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
        }

        .tab.active {
            background: #3498db;
        }

        .tab-pane {
            display: none;
            padding: 15px;
            background: #222;
            border-radius: 0 0 4px 4px;
            border: 1px solid #444;
            max-height: 400px;
            overflow-y: auto;
        }

        .tab-pane.active {
            display: block;
        }

        .result-card {
            background: #111;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 10px;
            border-left: 3px solid;
        }

        .result-live {
            border-left-color: #20b27c;
        }

        .result-die {
            border-left-color: #ff014f;
        }

        .result-unknown {
            border-left-color: #fce00c;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .stat-box {
            background: #222;
            padding: 5px 10px;
            border-radius: 4px;
        }

        .generator-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #222;
            padding: 20px;
            border-radius: 8px;
            width: 50%;
            max-width: 600px;
        }

        .modal-close {
            float: right;
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #333;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #20b27c);
            width: 0%;
            transition: width 0.3s;
        }

        @media (max-width: 768px) {
            .modal-content {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>CHKR.CC Automatização</h1>
            <span id="version">v2.0.0 - 2026-03-01</span>
        </div>

        <div class="input-section">
            <textarea id="inputCards" placeholder="Insira os cards (um por linha):
4552250055368xx3|08|2026|113
4347690271094833|12|2028|313
4347690273247843|11|2029|846
4347690279515557|02|2029|173"></textarea>

            <div class="buttons">
                <button id="startBtn" class="btn active">
                    <span></span> Iniciar
                </button>
                <button id="stopBtn" class="btn btn-danger" disabled>
                    <span></span> Parar
                </button>
                <button id="clearBtn" class="btn">
                    <span></span> Limpar
                </button>
                <button id="generateBinBtn" class="btn btn-primary">
                    <span></span> Gerador BIN
                </button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-box">Total: <span id="totalCount">0</span></div>
            <div class="stat-box">Live: <span id="liveCount" style="color:#20b27c">0</span></div>
            <div class="stat-box">Die: <span id="dieCount" style="color:#ff014f">0</span></div>
            <div class="stat-box">Unknown: <span id="unknownCount" style="color:#fce00c">0</span></div>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="live">Live</button>
            <button class="tab" data-tab="die">Die</button>
            <button class="tab" data-tab="unknown">Unknown</button>
        </div>

        <div class="tab-panes">
            <div id="live-pane" class="tab-pane active">
                <div id="liveResults"></div>
            </div>
            <div id="die-pane" class="tab-pane">
                <div id="dieResults"></div>
            </div>
            <div id="unknown-pane" class="tab-pane">
                <div id="unknownResults"></div>
            </div>
        </div>
    </div>

    <div class="generator-modal" id="binModal">
        <div class="modal-content">
            <button class="modal-close" id="closeModal">&times;</button>
            <h2>Gerador BIN Aleatório</h2>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0;">
                <div>
                    <label>BIN (vazio = random 42k-47k)</label>
                    <input type="text" id="binInput" placeholder="42424242">
                </div>
                <div>
                    <label>Quantidade</label>
                    <input type="number" id="quantity" min="1" max="100" value="10">
                </div>
                <div>
                    <label>Mês (vazio = random)</label>
                    <select id="monthSelect">
                        <option value="">Random</option>
                        <option value="01">Janeiro (01)</option>
                        <option value="02">Fevereiro (02)</option>
                        <option value="03">Março (03)</option>
                        <option value="04">Abril (04)</option>
                        <option value="05">Maio (05)</option>
                        <option value="06">Junho (06)</option>
                        <option value="07">Julho (07)</option>
                        <option value="08">Agosto (08)</option>
                        <option value="09">Setembro (09)</option>
                        <option value="10">Outubro (10)</option>
                        <option value="11">Novembro (11)</option>
                        <option value="12">Dezembro (12)</option>
                    </select>
                </div>
                <div>
                    <label>Ano (vazio = random 25-30)</label>
                    <select id="yearSelect">
                        <option value="">Random</option>
                        <option value="25">2025</option>
                        <option value="26">2026</option>
                        <option value="27">2027</option>
                        <option value="28">2028</option>
                        <option value="29">2029</option>
                        <option value="30">2030</option>
                    </select>
                </div>
                <div>
                    <label>CVV (vazio = random)</label>
                    <input type="number" id="cvvInput" placeholder="Leave blank for random">
                </div>
                <div style="display: flex; align-items: flex-end;">
                    <button id="generateBIN" style="width:100%; padding:8px;">Gerar Cards</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Status do scraping
        let isRunning = false;
        let abortController = null;

        // Elementos DOM
        const inputCards = document.getElementById('inputCards');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const generateBinBtn = document.getElementById('generateBinBtn');
        const binModal = document.getElementById('binModal');
        const closeModal = document.getElementById('closeModal');
        const generateBIN = document.getElementById('generateBIN');
        const binInput = document.getElementById('binInput');
        const quantity = document.getElementById('quantity');
        const monthSelect = document.getElementById('monthSelect');
        const yearSelect = document.getElementById('yearSelect');
        const cvvInput = document.getElementById('cvvInput');

        // Tabs
        const tabs = document.querySelectorAll('.tab');
        const tabPanes = document.querySelectorAll('.tab-pane');

        // Resultados
        const liveResults = document.getElementById('liveResults');
        const dieResults = document.getElementById('dieResults');
        const unknownResults = document.getElementById('unknownResults');

        // Contadores
        const totalCount = document.getElementById('totalCount');
        const liveCount = document.getElementById('liveCount');
        const dieCount = document.getElementById('dieCount');
        const unknownCount = document.getElementById('unknownCount');

        // Inicializar contadores
        let stats = { total: 0, live: 0, die: 0, unknown: 0 };

        // Switch tabs
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                tabPanes.forEach(pane => pane.classList.remove('active'));
                document.getElementById(tab.dataset.tab + '-pane').classList.add('active');
            });
        });

        // Botão Iniciar
        startBtn.addEventListener('click', () => {
            if (!isRunning) {
                const cardsText = inputCards.value.trim();
                if (!cardsText) {
                    alert('Insira os cards no textarea.');
                    return;
                }

                isRunning = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                inputCards.disabled = true;

                stats = { total: 0, live: 0, die: 0, unknown: 0 };
                updateStats();

                startScraping(cardsText.split('\n').filter(card => card.trim()));
            }
        });

        // Botão Parar
        stopBtn.addEventListener('click', () => {
            if (isRunning) {
                if (abortController) {
                    abortController.abort();
                }
                isRunning = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                inputCards.disabled = false;
            }
        });

        // Botão Clear
        clearBtn.addEventListener('click', () => {
            inputCards.value = '';
            liveResults.innerHTML = '';
            dieResults.innerHTML = '';
            unknownResults.innerHTML = '';
            stats = { total: 0, live: 0, die: 0, unknown: 0 };
            updateStats();
        });

        // Botão Gerador BIN
        generateBinBtn.addEventListener('click', () => {
            binModal.style.display = 'flex';
        });

        // Fechar modal
        closeModal.addEventListener('click', () => {
            binModal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === binModal) {
                binModal.style.display = 'none';
            }
        });

        // Gerar BINs
        generateBIN.addEventListener('click', () => {
            const bin = binInput.value.trim();
            const qty = parseInt(quantity.value) || 1;
            const month = monthSelect.value;
            const year = yearSelect.value;
            const cvv = cvvInput.value.trim();

            let generated = [];
            const prefix = bin || getRandomBIN();

            for (let i = 0; i < qty; i++) {
                const cardNumber = generateCardNumber(prefix);
                const expiry = month ? `${month}|${year || getRandomYear()}` : `${getRandomMonth()}|${getRandomYear()}`;

                let card;
                if (cvv) {
                    card = `${cardNumber}|${expiry}|${cvv}`;
                } else {
                    card = `${cardNumber}|${expiry}|${getRandomCVV()}`;
                }
                generated.push(card);
            }

            inputCards.value = generated.join('\n');
            binModal.style.display = 'none';
        });

        // Funções de suporte
        function getRandomBIN() {
            const bins = [42424242, 45321111, 44171234, 48062222, 47161801];
            return bins[Math.floor(Math.random() * bins.length)].toString();
        }

        function getRandomYear() {
            return Math.floor(Math.random() * 6) + 25; // 25-30
        }

        function getRandomMonth() {
            return Math.floor(Math.random() * 12) + 1;
        }

        function getRandomCVV() {
            return Math.floor(Math.random() * 900) + 100; // 100-999
        }

        function generateCardNumber(prefix) {
            let digits = prefix;
            while (digits.length < 16) {
                digits += Math.floor(Math.random() * 10);
            }
            return digits.slice(0, 16);
        }

        function updateStats() {
            totalCount.textContent = stats.total;
            liveCount.textContent = stats.live;
            dieCount.textContent = stats.die;
            unknownCount.textContent = stats.unknown;
        }

        // Requisições para a API
        async function checkCard(cardData) {
            const url = 'https://api.chkr.cc/';

            const payload = {
                data: cardData,
                charge: false
            };

            const headers = {
                'Content-Type': 'application/json; charset=utf-8',
                'User-Agent': 'Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/149.0.0.0 Mobile Safari/537.36',
                'Referer': 'https://chkr.cc/',
                'Origin': 'https://chkr.cc'
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(payload),
                    signal: abortController.signal
                });

                if (response.status === 200) {
                    return await response.json();
                } else if (response.status === 429) {
                    throw new Error('Rate limit exceeded');
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                if (error.name !== 'AbortError') {
                    console.error('Erro na requisição:', error);
                }
                return null;
            }
        }

        // Processar cards
        async function processCards(cards) {
            for (const card of cards) {
                if (!isRunning) break;

                const data = card.trim();
                if (!data) continue;

                stats.total++;
                updateStats();

                const result = await checkCard(data);

                if (!result) {
                    stats.unknown++;
                    addResult('unknown', data, { status: 'Unknown', error: 'Erro na requisição' });
                    continue;
                }

                switch (result.code) {
                    case 1:
                        stats.live++;
                        addResult('live', data, result);
                        break;
                    case 0:
                        stats.die++;
                        addResult('die', data, result);
                        break;
                    case 2:
                        stats.unknown++;
                        addResult('unknown', data, result);
                        break;
                }

                updateStats();
            }
        }

        function addResult(type, card, details) {
            const container = {
                'live': liveResults,
                'die': dieResults,
                'unknown': unknownResults
            }[type];

            const element = document.createElement('div');
            element.className = 'result-card result-' + type;

            let html = `
                <strong>${card}</strong><br>
                Status: <em>${details.status || 'Desconhecido'}</em><br>
                Banco: ${details.card?.bank || 'N/A'}<br>
                Tipo: ${details.card?.type?.toUpperCase() || 'N/A'}<br>
                Categoria: ${details.card?.category || 'N/A'}<br>
                País: ${details.card?.country?.name || 'N/A'} ${details.card?.country?.emoji || ''}
            `;

            if (details.message) {
                html += `<br><small>${details.message}</small>`;
            }

            element.innerHTML = html;
            container.appendChild(element);
        }

        // Scraping principal
        function startScraping(cards) {
            abortController = new AbortController();

            processCards(cards).finally(() => {
                isRunning = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                inputCards.disabled = false;
            });
        }
    </script>
</body>
</html>
