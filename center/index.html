<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
* { margin:0; padding:0; box-sizing:border-box; outline:none; }

body {
    height: 100vh;
    background-color: #05050f;
    overflow: hidden;
    position: relative;
    font-family: 'Inter', sans-serif;
    color: #c5c6c7;
}

#matrixCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
}

.neon-wireframe {
    position: absolute;
    top: 5%; left: 5%;
    width: 90%; height: 90%;
    border: 2px solid rgba(0,255,255,0.15);
    border-radius: 20px;
    pointer-events: none;
    box-shadow: 0 0 15px rgba(0,255,255,0.1), inset 0 0 15px rgba(0,255,255,0.1);
    z-index: 1;
}
.neon-wireframe::before,
.neon-wireframe::after {
    content: '';
    position: absolute;
    width: 40px; height: 40px;
    border: 2px solid;
    border-color: rgba(255,0,255,0.4) rgba(0,255,255,0.4);
}
.neon-wireframe::before {
    top: -10px; left: -10px;
    border-top-left-radius: 10px;
    border-bottom: none; border-right: none;
}
.neon-wireframe::after {
    bottom: -10px; right: -10px;
    border-bottom-right-radius: 10px;
    border-top: none; border-left: none;
}

#tela-login {
    position: relative;
    z-index: 10;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.login-box {
    background-color: rgba(5,5,15,0.85);
    border: 1px solid rgba(0,255,255,0.2);
    padding: 40px 30px;
    border-radius: 15px;
    box-shadow: 0 0 40px rgba(0,0,0,1), 0 0 15px rgba(0,255,255,0.1) inset;
    width: 90%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    backdrop-filter: blur(8px);
}

.avatar-section {
    position: relative;
    width: 150px; height: 150px;
    margin-bottom: 25px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.text-ring-svg {
    position: absolute;
    width: 100%; height: 100%;
    animation: rotateText 15s linear infinite;
}
.text-ring-path { fill: none; }
.text-ring-content {
    fill: #00ffff;
    font-family: 'Orbitron', sans-serif;
    font-size: 8.5px;
    font-weight: 700;
    letter-spacing: 2px;
}
@keyframes rotateText {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.avatar-image {
    width: 90px; height: 90px;
    border-radius: 50%;
    border: 2px solid #00ffff;
    background-color: #1a1a3a;
    background-image: url('https://upload.wikimedia.org/wikipedia/en/c/c6/NeoTheMatrix.jpg');
    background-size: cover;
    background-position: top center;
    box-shadow: 0 0 20px rgba(0,255,255,0.5);
    z-index: 2;
}

.neon-ring-blue {
    position: absolute;
    width: 110px; height: 110px;
    border: 2px dashed rgba(0,255,255,0.6);
    border-radius: 50%;
    z-index: 1;
    animation: rotateReverse 20s linear infinite;
}
@keyframes rotateReverse {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
}

.neon-ring-magenta {
    position: absolute;
    width: 125px; height: 125px;
    border: 1px solid rgba(255,0,255,0.6);
    border-radius: 50%;
    z-index: 0;
    animation: ringPulse 2s ease-in-out infinite alternate;
}
@keyframes ringPulse {
    0% { transform: scale(0.95); opacity: 0.5; }
    100% { transform: scale(1.02); opacity: 1; }
}

.welcome-text {
    color: #00ffff;
    font-size: 0.9rem;
    text-align: center;
    margin-bottom: 25px;
    font-family: 'Orbitron', sans-serif;
    text-shadow: 0 0 8px rgba(0,255,255,0.4);
    line-height: 1.5;
    letter-spacing: 1px;
}
.welcome-text span {
    font-weight: 700;
    text-shadow: 0 0 10px rgba(0,255,255,0.8);
}

.login-form { width: 100%; }

.input-group {
    position: relative;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    padding: 0 15px;
}

.input-neon-frame {

    inset: 0;
    border: 1px solid;
    pointer-events: none;

    background: rgba(0,0,0,0.6);
}
.input-group:nth-child(1) .input-neon-frame { border-color: rgba(0,255,255,0.4); }
.input-group:nth-child(2) .input-neon-frame,
.input-group:nth-child(3) .input-neon-frame { border-color: rgba(255,0,255,0.4); }
.input-group:focus-within:nth-child(1) .input-neon-frame {

}
.input-group:focus-within:nth-child(2) .input-neon-frame,

}

.neon-icon {

}

.input-group:nth-child(2) .neon-icon,

.input-cursor {

.click-here-btn {

.container {

.info-bar {

.status {

.detalhes {

.empty {

}

.modal {
    display: none;

    inset: 0;

    justify-content: center;
    align-items: center;

.modal.show { display: flex; }

.modal-box {
    background: rgba(10,10,25,0.95);

@media (max-width: 600px) {
    .app-header { flex-direction: column; align-items: flex-start; }
    .actions { width: 100%; }
    .actions button { flex: 1; }
}
</style>
</head>

<div class="neon-wireframe"></div>

<script>
// MATRIX RAIN
const canvas = document.getElementById('matrixCanvas');
const ctx = canvas.getContext('2d');
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
const fontSize = 16;
let columns = canvas.width / fontSize;
let drops = [];
function initDrops() {
    columns = canvas.width / fontSize;
    drops = [];
    for (let x = 0; x < columns; x++) drops[x] = 1;
}
initDrops();
function draw() {
    ctx.fillStyle = 'rgba(5,5,15,0.08)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00ffff';
    ctx.font = fontSize + 'px Orbitron, monospace';
    for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(draw, 33);
window.addEventListener('resize', () => { resizeCanvas(); initDrops(); });

// CONFIG JSONBIN
const JSONBIN_URL = "https://api.jsonbin.io/v3/b/6a6b901cf5f4af5e29d6dab3";
const MASTER_KEY  = "$2a$10$L2TVNqek/J16zqH/lHHkZe/wLZlo4VwmHQKm8KWtGDsrigGB3.OlC";

let usuario = null;
let dados = { items: [], users: [], historico: [] };
let encontrados = [];

// HELPERS
async function getData() {
    try {
        const res = await fetch(JSONBIN_URL + "/latest", {
            headers: { "X-Master-Key": MASTER_KEY }
        });
        if (!res.ok) throw new Error("Erro");
        return (await res.json()).record;
    } catch (e) {
        console.error(e);
        return null;
    }
}

async function saveData(obj) {
    await fetch(JSONBIN_URL, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json",
            "X-Master-Key": MASTER_KEY
        },
        body: JSON.stringify(obj)
    });
}

function normalizar(raw) {
    if (Array.isArray(raw)) return { items: raw, users: [], historico: [] };
    return {
        items: raw?.items || [],
        users: raw?.users || [],
        historico: raw?.historico || []
    };
}

// LOGIN / CADASTRO
function mostrarCadastro() {
    document.getElementById("form-login").style.display = "none";
    document.getElementById("form-cadastro").style.display = "block";
}
function mostrarLogin() {
    document.getElementById("form-cadastro").style.display = "none";
    document.getElementById("form-login").style.display = "block";
}

async function fazerCadastro() {
    const user = document.getElementById("cadUser").value.trim();
    const pass = document.getElementById("cadPass").value;
    const pass2 = document.getElementById("cadPass2").value;

    if (!user || !pass) return alert("Preencha usuário e senha");
    if (pass !== pass2) return alert("As senhas não coincidem");
    if (pass.length < 3) return alert("Senha muito curta");

    let raw = await getData();
    let data = normalizar(raw);

    if (data.users.find(u => u.nome.toLowerCase() === user.toLowerCase())) {
        return alert("Esse usuário já existe");
    }

    const novo = {
        id: "user_" + Date.now().toString(36),
        nome: user,
        senha: pass,
        avatar: "https://i.imgur.com/8Km9tLL.png",
        xp: 0,
        level: 1,
        dataCadastro: new Date().toISOString()
    };

    data.users.push(novo);
    await saveData(data);
    alert("Conta criada com sucesso!");
    loginUsuario(novo);
}

async function fazerLogin() {
    const user = document.getElementById("loginUser").value.trim();
    const pass = document.getElementById("loginPass").value;

    if (!user || !pass) return alert("Preencha usuário e senha");

    let raw = await getData();
    let data = normalizar(raw);
    if (Array.isArray(raw)) await saveData(data);

    const encontrado = data.users.find(u =>
        u.nome.toLowerCase() === user.toLowerCase() && u.senha === pass
    );

    if (!encontrado) return alert("Usuário ou senha incorretos");
    loginUsuario(encontrado);
}

function loginUsuario(user) {
    usuario = user;
    localStorage.setItem("dg_user", JSON.stringify(user));

    document.getElementById("tela-login").style.display = "none";
    document.getElementById("app").style.display = "block";

    document.getElementById("nome-user").textContent = user.nome;
    document.getElementById("avatar").src = user.avatar || "https://i.imgur.com/8Km9tLL.png";
    document.getElementById("xp").textContent = user.xp || 0;
    document.getElementById("level").textContent = Math.floor((user.xp || 0) / 100) + 1;

    carregarTudo();
}

function logout() {
    localStorage.removeItem("dg_user");
    usuario = null;
    document.getElementById("app").style.display = "none";
    document.getElementById("tela-login").style.display = "flex";
    document.getElementById("loginUser").value = "";
    document.getElementById("loginPass").value = "";
    mostrarLogin();
}

// CARREGAR LISTAS
async function carregarTudo() {
    const mural = document.getElementById("mural");
    mural.innerHTML = `<div class="empty">Carregando...</div>`;

    let raw = await getData();
    if (!raw) {
        mural.innerHTML = `<div class="empty" style="color:#ff3366;">Erro ao conectar</div>`;
        return;
    }

    let data = normalizar(raw);
    data.items = (data.items || []).map(item => {
        if (item.ownerId === undefined) {
            item.ownerId = null;
            item.ownerNome = null;
            item.dataSorteio = null;
        }
        return item;
    });

    dados = data;
    
    // Histórico fixo: Se o cartão tiver ownerId igual ao do usuário atual, ele será listado aqui.
    // Assim que é sorteado, o ID do usuário fica colado no cartão para sempre.
    const meus = data.items.filter(c => c.ownerId === usuario.id);
    
    // O pool é formado SOMENTE por cartões que não têm dono (estão nulos)
    const disponiveis = data.items.filter(c => !c.ownerId);

    document.getElementById("qtd-meus").textContent = meus.length;
    document.getElementById("qtd-disp").textContent = disponiveis.length;
    
    renderizarCards(meus);
}

// RENDERIZAR MEUS CARTÕES
function renderizarCards(lista) {
    const mural = document.getElementById("mural");
    mural.innerHTML = "";

    if (!lista || lista.length === 0) {
        mural.innerHTML = `<div class="empty">Nenhum cartão ainda.<br><br>Clique em <strong style="color:#ffaa00">PUXAR</strong> para sortear.</div>`;
        return;
    }

    lista.forEach(item => {
        if (!item.numero_cartao) return;

        // VALIDADE - tratamento reforçado
        let mes = item.mes_validade || item.mes || item.exp_month || item.validade_mes || "--";
        let ano = item.ano_validade || item.ano || item.exp_year || item.validade_ano || "----";

        if ((!item.mes_validade && !item.ano_validade) && item.validade) {
            const partes = String(item.validade).replace(/\s/g, "").split(/[\/\-]/);
            if (partes.length === 2) {
                mes = partes[0].padStart(2, "0");
                ano = partes[1].length === 2 ? "20" + partes[1] : partes[1];
            }
        }

        mes = String(mes).padStart(2, "0");
        if (String(ano).length === 2) ano = "20" + ano;

        const cvv = item.cvv || item.cvc || "---";
        const banco = item.banco || item.bank || "—";
        const classe = item.classe || item.tipo || "—";
        const pais = item.pais || item.country || "—";
        const retorno = item.retorno || item.return || item.status_retorno || "—";
        const statusTexto = item.status || "aguardando";

        const icon = item.bandeira === "VISA" ? "fab fa-cc-visa" :
                     item.bandeira === "MASTERCARD" ? "fab fa-cc-mastercard" : "fas fa-credit-card";

        const statusClass = statusTexto === "aguardando" ? "status-aguardando" :
                            statusTexto === "aprovado" ? "status-aprovado" : "status-recusado";

        const cor = item.bandeira === "VISA" ? "#1a1f71" : "#eb001b";

        const div = document.createElement("div");
        div.className = "card";
        
        // CORRIGIDO O PROBLEMA DA EXIBIÇÃO: Sintaxe correta das Template Strings => ${variavel} 
        div.innerHTML = `
            <div class="card-header">
                <i class="${icon} bandeira" style="color: ${cor}"></i>
                <span class="status ${statusClass}">${statusTexto}</span>
            </div>
            <div class="numero">${formatar(item.numero_cartao)}</div>
            <div class="detalhes">
                <div><strong>Validade:</strong> ${mes}/${ano}</div>
                <div><strong>CVV:</strong> ${cvv}</div>
                <div><strong>Banco:</strong> ${banco}</div>
                <div><strong>Classe:</strong> ${classe}</div>
                <div style="grid-column:1/-1"><strong>País:</strong> ${pais}</div>
                <div style="grid-column:1/-1;color:#ffaa00"><strong>Retorno:</strong> ${retorno}</div>
            </div>
        `;
        mural.appendChild(div);
    });
}

function formatar(num) {
    if (!num) return "•••• •••• •••• ••••";
    return String(num).replace(/(\d{4})(?=\d)/g, "$1 ");
}

// PUXAR (SORTEIO)
async function sortearCartao() {
    if (!usuario) return;
    let raw = await getData();
    let data = normalizar(raw);

    // Garante propriedades
    data.items = (data.items || []).map(item => {
        if (item.ownerId === undefined) {
            item.ownerId = null;
            item.ownerNome = null;
            item.dataSorteio = null;
        }
        return item;
    });

    // Pega apenas quem NÃO tem dono (pool público)
    const disponiveis = data.items.filter(c => !c.ownerId);
    if (disponiveis.length === 0) return alert("Não há mais cartões no pool!");

    // Sorteia 1
    const sorteado = disponiveis[Math.floor(Math.random() * disponiveis.length)];
    
    // Atualiza com o ID do usuário (isso o torna invisível pros outros e sempre visível pra ele)
    const idx = data.items.findIndex(c => c.id === sorteado.id);
    data.items[idx].ownerId = usuario.id;
    data.items[idx].ownerNome = usuario.nome;
    data.items[idx].dataSorteio = new Date().toISOString();

    // Cria registro de auditoria no histórico geral
    data.historico = data.historico || [];
    data.historico.push({
        userId: usuario.id,
        userNome: usuario.nome,
        acao: "sorteou",
        cartaoId: sorteado.id,
        data: new Date().toISOString()
    });

    await saveData(data);

    const mesAlert = sorteado.mes_validade || sorteado.mes || "--";
    const anoAlert = sorteado.ano_validade || sorteado.ano || "----";
    alert("Cartão sorteado!\n\n" + formatar(sorteado.numero_cartao) + "\nValidade: " + mesAlert + "/" + anoAlert);
    
    carregarTudo(); // Atualiza a tela puxando tudo novamente
}

// IMPORTADOR
function abrirImportador() {
    document.getElementById("textoImport").value = "";
    document.getElementById("fileImport").value = "";
    document.getElementById("previewBox").style.display = "none";
    encontrados = [];
    document.getElementById("modalImport").classList.add("show");
}
function fecharImportador() {
    document.getElementById("modalImport").classList.remove("show");
}

document.getElementById("fileImport").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        document.getElementById("textoImport").value = ev.target.result;
    };
    reader.readAsText(file);
});

function processarImport() {
    const texto = document.getElementById("textoImport").value.trim();
    if (!texto) return alert("Cole algum texto");

    encontrados = extrairCartoes(texto);
    document.getElementById("qtdPreview").textContent = encontrados.length;

    const lista = document.getElementById("previewLista");
    if (encontrados.length === 0) {
        lista.innerHTML = `<p style="color:#ff3366;text-align:center;">Nenhum cartão encontrado</p>`;
    } else {
        // CORRIGIDO O ERRO DE DIGITAÇÃO AQUI TAMBÉM NAS TEMPLATES
        lista.innerHTML = encontrados.map(function(c, i) {
            return `<div class="preview-card"><strong>#${i+1}</strong> ${formatar(c.numero_cartao)} | ${c.mes_validade}/${c.ano_validade} | CVV: ${c.cvv}</div>`;
        }).join("");
    }
    document.getElementById("previewBox").style.display = "block";
}

// MELHORIA: Extrator inteligente para formatos como cc|mes|ano|cvv
function extrairCartoes(texto) {
    const resultados = [];
    const linhas = texto.split(/\r?\n/);

    for (let i = 0; i < linhas.length; i++) {
        let linha = linhas[i].trim();
        if (!linha) continue;

        // Expressão Regular para pegar formatos perfeitamente definidos (cartao | mes | ano | cvv)
        // Suporta os separadores: espaço, barra normal, pipe (|), ou dois pontos.
        const regexPipe = /(\d{15,16})[\s\|\:\/]+(\d{2})[\s\|\:\/]+(\d{2,4})[\s\|\:\/]+(\d{3,4})/;
        let match = linha.match(regexPipe);

        let numero, mes, ano, cvv;

        if (match) {
            numero = match[1];
            mes = match[2];
            ano = match[3];
            cvv = match[4];
        } else {
            // Fallback: Tentativa de extração genérica solta no texto inteiro caso falhe
            const reCartao = /\b(\d{15,16})\b/;
            const linhaLimpa = linha.replace(/[\s\-]/g, "");
            const matchCard = linhaLimpa.match(reCartao);
            
            if (!matchCard) continue;
            numero = matchCard[1];

            const contexto = [linha, linhas[i+1]||"", linhas[i+2]||""].join(" ");
            const reVal = /\b(0[1-9]|1[0-2])[\/\-\s\|]+(2[0-9]{3}|[0-9]{2})\b/;
            const val = contexto.match(reVal);

            mes = "01";
            ano = "2030";
            if (val) {
                mes = val[1];
                ano = val[2];
            }

            const cvvs = contexto.match(/\b\d{3,4}\b/g) || [];
            cvv = "000";
            for (const c of cvvs) {
                if (c !== numero.slice(-3) && c !== numero.slice(-4) && c !== ano && c !== mes) {
                    cvv = c;
                    break;
                }
            }
        }

        if (numero.length < 15 || numero.length > 16) continue;

        mes = mes.padStart(2, "0");
        // Tratamento para evitar anos muito curtos ou bizarrices da digitação (ex: 22222)
        if (ano.length === 2) ano = "20" + ano;
        if (ano.length > 4) ano = ano.slice(0, 4); 

        resultados.push({
            id: String(Date.now()).slice(-6) + Math.floor(Math.random()*90+10),
            numero_cartao: numero,
            mes_validade: mes,
            ano_validade: ano,
            cvv: cvv,
            retorno: "Importado",
            banco: "UNKNOWN",
            pais: "UNITED STATES",
            classe: "CREDIT",
            bandeira: numero.startsWith("4") ? "VISA" : (numero.startsWith("5") || numero.startsWith("2")) ? "MASTERCARD" : numero.startsWith("3") ? "AMEX" : "UNKNOWN",
            status: "aguardando",
            ownerId: null, // Ao ser importado vem nulo para ir para o pool público
            ownerNome: null,
            dataSorteio: null
        });
    }

    const vistos = new Set();
    return resultados.filter(function(c) {
        if (vistos.has(c.numero_cartao)) return false;
        vistos.add(c.numero_cartao);
        return true;
    });
}

async function enviarImport() {
    if (encontrados.length === 0) return alert("Nada para enviar");

    let raw = await getData();
    let data = normalizar(raw);

    const existentes = new Set((data.items || []).map(function(i){ return i.numero_cartao; }));
    const novos = encontrados.filter(function(c){ return !existentes.has(c.numero_cartao); });

    if (novos.length === 0) return alert("Todos os cartões dessa lista já existem no sistema.");

    data.items = (data.items || []).concat(novos);
    await saveData(data);

    alert(novos.length + " cartão(ões) adicionados ao Pool Público!");
    fecharImportador();
    carregarTudo();
}

// INICIALIZADOR
window.onload = function() {
    const saved = localStorage.getItem("dg_user");
    if (saved) {
        try {
            loginUsuario(JSON.parse(saved));
        } catch(e) {
            localStorage.removeItem("dg_user");
        }
    }
};
