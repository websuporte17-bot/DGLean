<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de Login Futurista - FAST HARD LEGENDARY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    
    <style>
        /* Reset de estilos básicos */
        * {
            margin: 0;
            padding: 0;
            box-shadow: none;
            outline: none;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #05050f; 
            overflow: hidden;
            position: relative;
            font-family: 'Inter', sans-serif;
        }

        /* O Canvas do Matrix rodando no fundo com z-index negativo */
        #matrixCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* Moldura Geométrica de Neônio */
        .neon-wireframe {
            position: absolute;
            top: 5%;
            left: 5%;
            width: 90%;
            height: 90%;
            border: 2px solid rgba(0, 255, 255, 0.15);
            border-radius: 20px;
            pointer-events: none;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.1), inset 0 0 15px rgba(0, 255, 255, 0.1);
            z-index: 1;
        }

        .neon-wireframe::before,
        .neon-wireframe::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid;
            border-color: rgba(255, 0, 255, 0.4) rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3), 0 0 10px rgba(255, 0, 255, 0.3);
        }

        .neon-wireframe::before {
            top: -10px;
            left: -10px;
            border-top-left-radius: 10px;
            border-bottom: none;
            border-right: none;
        }
        
        .neon-wireframe::after {
            bottom: -10px;
            right: -10px;
            border-bottom-right-radius: 10px;
            border-top: none;
            border-left: none;
        }

        /* Container principal do login */
        .login-box {
            background-color: rgba(5, 5, 15, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.2);
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 1), 0 0 15px rgba(0, 255, 255, 0.1) inset;
            z-index: 10;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* Avatar e Anéis */
        .avatar-section {
            position: relative;
            width: 150px;
            height: 150px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .text-ring-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: rotateText 15s linear infinite;
        }

        .text-ring-path {
            fill: none;
        }

        .text-ring-content {
            fill: #00ffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 8.5px;
            font-weight: 700;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.8), 0 0 10px rgba(0, 255, 255, 0.5);
            letter-spacing: 2px;
        }

        @keyframes rotateText {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .avatar-image {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid #00ffff;
            background-color: #1a1a3a;
            /* Foto do Neo - Matrix */
            background-image: url('https://upload.wikimedia.org/wikipedia/en/c/c6/NeoTheMatrix.jpg');
            background-size: cover;
            background-position: top center;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5), inset 0 0 10px rgba(0, 255, 255, 0.3);
            z-index: 2;
        }

        .neon-ring-blue {
            position: absolute;
            width: 110px;
            height: 110px;
            border: 2px dashed rgba(0, 255, 255, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3), inset 0 0 5px rgba(0, 255, 255, 0.2);
            z-index: 1;
            animation: rotateReverse 20s linear infinite;
        }

        @keyframes rotateReverse {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        .neon-ring-magenta {
            position: absolute;
            width: 125px;
            height: 125px;
            border: 1px solid rgba(255, 0, 255, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.6), inset 0 0 5px rgba(255, 0, 255, 0.4);
            z-index: 0;
            animation: ringPulse 2s ease-in-out infinite alternate;
        }

        @keyframes ringPulse {
            0% { transform: scale(0.95); opacity: 0.5; border-color: rgba(255, 0, 255, 0.3); }
            100% { transform: scale(1.02); opacity: 1; border-color: rgba(255, 0, 255, 0.8); }
        }

        /* Texto de Boas-vindas (ATUALIZADO PARA AZUL CIANO) */
        .welcome-text {
            color: #00ffff;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 400; 
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
            line-height: 1.5;
            max-width: 320px;
            letter-spacing: 1px;
        }

        .welcome-text span {
            font-weight: 700; /* Deixa o "Sistema" em negrito */
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }

        /* Formulário de Login */
        .login-form {
            width: 100%;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            padding: 0 15px;
        }

        .input-neon-frame {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 1px solid;
            pointer-events: none;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        .input-group:nth-child(1) .input-neon-frame {
            border-color: rgba(0, 255, 255, 0.4);
            box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.1);
        }
        .input-group:nth-child(2) .input-neon-frame {
            border-color: rgba(255, 0, 255, 0.4);
            box-shadow: inset 0 0 10px rgba(255, 0, 255, 0.1);
        }

        .input-group:focus-within:nth-child(1) .input-neon-frame {
            border-color: rgba(0, 255, 255, 1);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.4), inset 0 0 10px rgba(0, 255, 255, 0.2);
        }
        .input-group:focus-within:nth-child(2) .input-neon-frame {
            border-color: rgba(255, 0, 255, 1);
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.4), inset 0 0 10px rgba(255, 0, 255, 0.2);
        }

        .neon-icon {
            font-size: 1.2rem;
            margin-right: 10px;
            position: relative;
            z-index: 2;
        }

        .input-group:nth-child(1) .neon-icon { color: #00ffff; text-shadow: 0 0 10px #00ffff; }
        .input-group:nth-child(2) .neon-icon { color: #ff00ff; text-shadow: 0 0 10px #ff00ff; }

        /* Cursor piscando */
        .input-cursor {
            color: rgba(255, 255, 255, 0.4); 
            font-family: 'Inter', sans-serif;
            font-weight: 300; 
            font-size: 1.2rem;
            margin-right: 8px;
            z-index: 2;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        .login-input {
            flex: 1;
            width: 100%;
            height: 50px;
            background-color: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            z-index: 2;
        }
        
        .login-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            font-family: 'Inter', sans-serif;
            letter-spacing: normal;
        }

        .waveform-pattern {
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            top: 0;
            pointer-events: none;
            border-radius: 8px;
            overflow: hidden;
            z-index: 1;
            opacity: 0.15;
            background: repeating-linear-gradient(90deg, transparent, transparent 2px, #ffffff 2px, #ffffff 4px);
            mask-image: linear-gradient(to right, black 20%, transparent 80%);
            -webkit-mask-image: linear-gradient(to right, black 20%, transparent 80%);
        }
        
        .input-group:nth-child(1) .waveform-pattern { background: repeating-linear-gradient(90deg, transparent, transparent 2px, #00ffff 2px, #00ffff 4px); }
        .input-group:nth-child(2) .waveform-pattern { background: repeating-linear-gradient(90deg, transparent, transparent 2px, #ff00ff 2px, #ff00ff 4px); }

        /* Botão Access Server */
        .click-here-btn {
            width: 100%;
            height: 55px;
            margin-top: 15px;
            background: linear-gradient(45deg, #091c3d, #1e3c72);
            border: 1px solid #00ffff;
            color: #fff;
            font-size: 1.1rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }

        .click-here-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.4), transparent);
            transition: 0.5s;
        }

        .click-here-btn:hover {
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.6), inset 0 0 15px rgba(0, 255, 255, 0.4);
            transform: translateY(-2px);
            background: linear-gradient(45deg, #1e3c72, #2b54a8);
        }
        
        .click-here-btn:hover::before { left: 100%; }
        .click-here-btn:active { transform: translateY(1px); }
    </style>
</head>
<body>

    <!-- O Canvas para a Chuva Digital (Matrix Rain) -->
    <canvas id="matrixCanvas"></canvas>

    <!-- Moldura Geométrica de Neônio -->
    <div class="neon-wireframe"></div>

    <!-- Container do Login -->
    <div class="login-box">
        
        <!-- Seção do Avatar -->
        <div class="avatar-section">
            <svg class="text-ring-svg" viewBox="0 0 150 150">
                <defs>
                    <path id="textRingPath" class="text-ring-path" d="M 75,75 m -60,0 a 60,60 0 1,1 120,0 a 60,60 0 1,1 -120,0" />
                </defs>
                <text class="text-ring-content">
                    <textPath href="#textRingPath" startOffset="0%">
                        FAST • HARD • LEGENDARY • FAST • HARD • LEGENDARY • FAST • HARD •
                    </textPath>
                </text>
            </svg>
            <div class="neon-ring-blue"></div>
            <div class="neon-ring-magenta"></div>
            <div class="avatar-image"></div>
        </div>

        <!-- Texto de Boas-vindas -->
        <h2 class="welcome-text">Bem-vindo(a), faça login para iniciar o <span>Sistema</span>.</h2>

        <!-- Formulário de Login -->
        <form class="login-form" id="loginForm">
            
            <div class="input-group">
                <div class="input-neon-frame"></div>
                <div class="neon-icon">👤</div>
                <div class="input-cursor">></div>
                <input type="text" class="login-input" placeholder="User Identifier" required autocomplete="off">
                <div class="waveform-pattern"></div>
            </div>

            <div class="input-group">
                <div class="input-neon-frame"></div>
                <div class="neon-icon">🔒</div>
                <div class="input-cursor">></div>
                <input type="password" class="login-input" placeholder="Security Protocol" required autocomplete="off">
                <div class="waveform-pattern"></div>
            </div>

            <button type="submit" class="click-here-btn">Access Server</button>

        </form>
    </div>

    <!-- Script de Animação do Canvas (Matrix Rain) e UI -->
    <script>
        // Animação da Chuva do Matrix
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();

        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
        const fontSize = 16;
        
        let columns = canvas.width / fontSize;
        let drops = [];

        function initDrops() {
            columns = canvas.width / fontSize;
            drops = [];
            for (let x = 0; x < columns; x++) {
                drops[x] = 1;
            }
        }
        initDrops();

        function draw() {
            ctx.fillStyle = 'rgba(5, 5, 15, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ffff'; 
            ctx.font = fontSize + 'px Orbitron, monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(draw, 33);

        window.addEventListener('resize', () => {
            resizeCanvas();
            initDrops();
        });

        // Controle do Formulário
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const feedback = document.createElement('div');
            feedback.style.position = 'fixed';
            feedback.style.top = '50%';
            feedback.style.left = '50%';
            feedback.style.transform = 'translate(-50%, -50%)';
            feedback.style.background = 'rgba(0, 0, 0, 0.9)';
            feedback.style.border = '2px solid #00ffff';
            feedback.style.color = '#fff';
            feedback.style.padding = '20px 40px';
            feedback.style.borderRadius = '10px';
            feedback.style.fontFamily = 'Orbitron, sans-serif';
            feedback.style.boxShadow = '0 0 20px #00ffff';
            feedback.style.zIndex = '1000';
            feedback.style.textAlign = 'center';
            feedback.innerHTML = '<h3 style="margin-bottom:10px; color:#00ffff;">ACESSO AUTORIZADO</h3><p>Conectando à Matrix...</p>';
            
            document.body.appendChild(feedback);

            setTimeout(() => {
                feedback.remove();
            }, 3000);
        });
    </script>
</body>
</html>
