<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Loja DGLean</title>
    <!-- Importando a biblioteca oficial do Mercado Pago -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <style>
        :root {
            --primary-color: #00c652;
            --bg-color: #0d1117; /* Fundo escuro estilo GitHub/Hacker */
            --card-bg: #161b22;
            --text-color: #c9d1d9;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .checkout-container {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
            width: 100%;
            max-width: 480px;
        }

        .header {
            text-align: center;
            border-bottom: 1px solid #30363d;
            padding-bottom: 25px;
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            color: var(--primary-color);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-weight: 800;
        }

        .header p {
            margin: 10px 0 0;
            font-size: 16px;
            color: #8b949e;
        }

        .price {
            font-size: 22px;
            color: #ffffff;
            font-weight: bold;
            display: block;
            margin-top: 5px;
        }

        #resultado {
            margin-top: 25px;
            padding: 15px;
            display: none;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
            font-size: 15px;
            line-height: 1.6;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .aprovado { 
            background-color: rgba(46, 204, 113, 0.1); 
            color: #2ecc71; 
            border: 1px solid #2ecc71; 
        }
        
        .recusado { 
            background-color: rgba(231, 76, 60, 0.1); 
            color: #ff5e5e; 
            border: 1px solid #e74c3c; 
        }
        
        .erro-servidor {
            background-color: rgba(241, 196, 15, 0.1); 
            color: #f1c40f; 
            border: 1px solid #f1c40f;
        }
    </style>
</head>
<body>

    <div class="checkout-container">
        <div class="header">
            <h1>DGLean</h1>
            <p>Produto: Anúncio de Teste</p>
            <span class="price">R$ 10,00</span>
        </div>
        
        <!-- O formulário do Mercado Pago -->
        <div id="paymentBrick_container"></div>

        <!-- Mensagens de Resultado -->
        <div id="resultado"></div>
    </div>

    <script>
        // Substitua pela sua Chave Pública (TEST-...) se for diferente desta
        const mp = new MercadoPago('TEST-da788e0b-6fa3-43d1-9cfa-81128b766a2e', {
            locale: 'pt-BR'
        });
        
        const bricksBuilder = mp.bricks();

        const renderPaymentBrick = async (bricksBuilder) => {
            const settings = {
                initialization: {
                    amount: 10.00,
                },
                customization: {
                    paymentMethods: {
                        creditCard: "all",
                        pix: "all"
                    },
                },
                callbacks: {
                    onReady: () => {
                        console.log('Checkout carregado com sucesso.');
                    },
                    onSubmit: ({ selectedPaymentMethod, formData }) => {
                        return new Promise((resolve, reject) => {
                            fetch('https://dglean.onrender.com/process_payment', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                },
                                body: JSON.stringify(formData),
                            })
                            .then((response) => response.json())
                            .then((data) => {
                                resolve();
                                
                                const divResultado = document.getElementById('resultado');
                                divResultado.style.display = 'block';

                                // Tratamento melhorado para evitar o "undefined"
                                if (data.status === 'approved') {
                                    divResultado.className = 'aprovado';
                                    divResultado.innerHTML = `✅ Pagamento Aprovado!<br>ID da transação: ${data.id}`;
                                } else if (data.status) {
                                    // Pega o status_detail se existir, se não, mostra um aviso amigável
                                    const motivo = data.status_detail || 'Recusado pelo sistema de segurança';
                                    divResultado.className = 'recusado';
                                    divResultado.innerHTML = `❌ Pagamento Recusado.<br>Motivo: ${motivo}`;
                                } else {
                                    // Se a API não devolveu nem status (Erro 500 do Render, por exemplo)
                                    const erroReal = data.error || 'Erro na comunicação com a API.';
                                    divResultado.className = 'erro-servidor';
                                    divResultado.innerHTML = `⚠️ Falha no processamento.<br>Detalhe: ${erroReal}`;
                                }
                            })
                            .catch((error) => {
                                reject();
                                const divResultado = document.getElementById('resultado');
                                divResultado.style.display = 'block';
                                divResultado.className = 'erro-servidor';
                                divResultado.innerHTML = `⚠️ Erro de conexão.<br>Não foi possível acessar a API no Render.`;
                                console.error("Erro no fetch:", error);
                            });
                        });
                    },
                    onError: (error) => {
                        console.error("Erro no Brick:", error);
                    },
                },
            };
            
            window.paymentBrickController = await bricksBuilder.create(
                'payment',
                'paymentBrick_container',
                settings
            );
        };

        renderPaymentBrick(bricksBuilder);
    </script>
</body>
</html>
