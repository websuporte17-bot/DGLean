<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG IP Investigator</title>
    <style>
        body {
            background-color: #0d0d12;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: #1a1a24;
            padding: 20px;
            border: 1px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            width: 100%;
            max-width: 500px;
            border-radius: 8px;
        }
        h2 {
            margin-top: 0;
            text-align: center;
            color: #ff0055;
            text-shadow: 0 0 5px #ff0055;
        }
        .info-box {
            background: #000;
            padding: 15px;
            border-left: 4px solid #00ffcc;
            margin-bottom: 20px;
            font-size: 1.2em;
            word-break: break-all;
        }
        .search-area {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .icon-label {
            background: #00ffcc;
            color: #000;
            padding: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            border-radius: 4px 0 0 4px;
        }
        input[type="text"] {
            flex-grow: 1;
            background: #000;
            border: 1px solid #00ffcc;
            color: #fff;
            padding: 10px;
            font-family: inherit;
            outline: none;
        }
        button {
            background: transparent;
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        button:hover {
            background: #00ffcc;
            color: #000;
        }
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-investigate {
            background: #2b00ff;
            color: #fff;
            border-color: #2b00ff;
            text-transform: uppercase;
        }
        .btn-investigate:hover {
            background: #fff;
            color: #2b00ff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>DASHBOARD DE RASTREIO</h2>
        
        <p>Seu IP Normal Atual:</p>
        <div class="info-box" id="meuIpInfo">
            Carregando IP...
        </div>

        <p>Pesquisar / Investigar outro IP:</p>
        <div class="search-area">
            <div class="icon-label">🌐 IP</div>
            <input type="text" id="ipInput" placeholder="Ex: 177.45.67.89">
            <button id="btnAnalisar">ANALISAR</button>
        </div>

        <div class="action-buttons" id="areaBotoes" style="display: none;">
            <p style="color: #fff;">Consultar histórico de Spam/Golpes para este IP:</p>
            <!-- O AbuseIPDB é o maior banco de dados do mundo para IPs maliciosos -->
            <button class="btn-investigate" id="btnAbuseIPDB">Consultar no AbuseIPDB</button>
            <!-- O VirusTotal checa se o IP distribui vírus -->
            <button class="btn-investigate" id="btnVirusTotal">Consultar no VirusTotal</button>
        </div>
    </div>

    <script>
        const meuIpInfo = document.getElementById('meuIpInfo');
        const ipInput = document.getElementById('ipInput');
        const btnAnalisar = document.getElementById('btnAnalisar');
        const areaBotoes = document.getElementById('areaBotoes');
        const btnAbuseIPDB = document.getElementById('btnAbuseIPDB');
        const btnVirusTotal = document.getElementById('btnVirusTotal');

        let ipAtualParaAnalise = "";

        // Função para buscar o IP real (IPv4) de quem está acessando
        async function pegarMeuIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                meuIpInfo.innerText = data.ip;
                
                // Já preenche o campo de pesquisa com o seu próprio IP para facilitar
                ipInput.value = data.ip;
                prepararBotoesDeInvestigacao(data.ip);
            } catch (error) {
                meuIpInfo.innerText = "Erro ao obter IP.";
                meuIpInfo.style.color = "#ff0055";
            }
        }

        function prepararBotoesDeInvestigacao(ip) {
            ipAtualParaAnalise = ip;
            areaBotoes.style.display = "flex";
            
            // Monta os links de redirecionamento para investigação
            btnAbuseIPDB.onclick = () => {
                window.open(`https://www.abuseipdb.com/check/${ipAtualParaAnalise}`, '_blank');
            };
            
            btnVirusTotal.onclick = () => {
                window.open(`https://www.virustotal.com/gui/search/${ipAtualParaAnalise}`, '_blank');
            };
        }

        // Quando clicar em analisar um IP manual
        btnAnalisar.addEventListener('click', () => {
            const ipDigitado = ipInput.value.trim();
            if (ipDigitado !== "") {
                prepararBotoesDeInvestigacao(ipDigitado);
            } else {
                alert("Digite um IP válido primeiro.");
            }
        });

        // Inicia pegando o IP assim que a página carrega
        pegarMeuIP();
    </script>
</body>
</html>
