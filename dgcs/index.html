<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG DEV HIGH SCHOOL | Portal Oficial (Preto)</title>
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
        /* FUNDO PRETO DEFINITIVO */
        body { background: #000000; color: #ffffff; overflow-x: hidden; }
        .container { max-width: 800px; margin: 40px auto; padding: 20px; }
        .box { background: #101820; padding: 30px; border: 1px solid #00ffcc; box-shadow: 0 0 15px rgba(0,255,204,0.2); margin-bottom: 20px; text-align: center; }
        input, .btn { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 4px; outline: none; }
        input { background: #1a2634; border: 1px solid #00ffcc; color: #ffffff; }
        .btn { background: #00ffcc; color: #000000; border: 1px solid #00ffcc; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        .btn:hover { background: #00cc99; }
        .btn-cursos { background: #00ffcc; color: #000000; padding: 15px; font-size: 16px; text-decoration: none; display: block; margin-top: 15px; text-align: center; border: 1px solid #00ffcc; font-weight: bold; }
        .hidden { display: none !important; }
        .alert { color: #ff3366; border: 1px solid #ff3366; padding: 15px; margin-bottom: 15px; background: rgba(255, 51, 102, 0.1); font-weight: bold; }
        .success-box { color: #00ffcc; border: 1px solid #00ffcc; padding: 15px; margin-bottom: 15px; background: rgba(0, 255, 204, 0.1); font-weight: bold; text-align: left; }
        .status-msg { background: #ffcc00; color: #000000; border: 1px solid #ff9900; padding: 12px; margin-bottom: 15px; font-weight: bold; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- TELA DE LOGIN / CADASTRO -->
        <div id="auth-box" class="box">
            <h2>Terminal DG Malvadão - Acesso</h2>
            <br>
            <input type="email" id="email" placeholder="E-mail de Acesso">
            <input type="password" id="senha" placeholder="Chave de Segurança">
            <button class="btn" onclick="login()">Iniciar Sessão</button>
            <button class="btn" onclick="mostrarCadastro()" style="background: transparent; color: #00ffcc; border-color: #00ffcc;">Cadastrar Nova Conta</button>
        </div>

        <!-- TELA DE CADASTRO COMPLETO -->
        <div id="register-box" class="box hidden">
            <h2>Cadastro Completo do Operador</h2>
            <br>
            <input type="text" id="reg-nome" placeholder="Nome Completo">
            <input type="email" id="reg-email" placeholder="E-mail">
            <input type="password" id="reg-senha" placeholder="Senha">
            <input type="text" id="reg-cpf" placeholder="CPF">
            <input type="text" id="reg-telefone" placeholder="Telefone / WhatsApp">
            <input type="text" id="reg-endereco" placeholder="Endereço Completo">
            <button class="btn" onclick="cadastrarCompleto()">Finalizar Cadastro</button>
            <button class="btn" onclick="voltarLogin()" style="background: transparent; color: #fff; border-color: #fff;">Voltar ao Login</button>
        </div>

        <!-- TELA DE STATUS / PAGAMENTO -->
        <div id="payment-box" class="box hidden">
            <div id="status-assinatura"></div>
            <div id="form-pagamento-container">
                <div class="alert">CONTA INATIVA. Taxa de liberação: R$ 50,00.</div>
                <div id="paymentBrick_container"></div>
            </div>
            <!-- MENSAGEM ESTÁTICA EM CIMA DO BOTÃO DESCONECTAR -->
            <div id="feedback-processamento" class="hidden"></div>
            <button class="btn" onclick="logout()" style="margin-top: 10px; border-color: #ff3366; color: #ff3366; background: transparent;">Desconectar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA4qjeR-wbHmCtEGcnYN2FG4D9zR4xwQsU",
            authDomain: "proia-fff09.firebaseapp.com",
            projectId: "proia-fff09",
            storageBucket: "proia-fff09.firebasestorage.app",
            messagingSenderId: "1036426093065",
            appId: "1:1036426093065:web:be300aec12fafb486bced8"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const mp = new MercadoPago('TEST-da788e0b-6fa3-43d1-9cfa-81128b766a2e', { locale: 'pt-BR' });
        const bricksBuilder = mp.bricks();
        let paymentBrickController;

        onAuthStateChanged(auth, async (user) => {
            const authBox = document.getElementById('auth-box');
            const paymentBox = document.getElementById('payment-box');
            const registerBox = document.getElementById('register-box');

            if (user) {
                authBox.classList.add('hidden');
                registerBox.classList.add('hidden');
                
                const docSnap = await getDoc(doc(db, "usuarios", user.uid));
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    paymentBox.classList.remove('hidden');
                    
                    if (data.acesso_liberado === true) {
                        document.getElementById('form-pagamento-container').classList.add('hidden');
                        document.getElementById('status-assinatura').innerHTML = `
                            <div class="success-box">
                                <h3>STATUS: ASSINATURA ATIVA</h3>
                                <hr style="margin: 8px 0; border-color: #00ffcc;">
                                <p><strong>Nome:</strong> ${data.nome || 'Não informado'}</p>
                                <p><strong>E-mail:</strong> ${data.email || user.email}</p>
                                <p><strong>CPF:</strong> ${data.cpf || 'Não informado'}</p>
                                <p><strong>Data/Hora da Compra:</strong> ${data.dataAssinatura || 'Registrado'}</p>
                                <p><strong>Status do Pagamento:</strong> Aprovado com Segurança</p>
                            </div>
                            <a href="app.html" class="btn-cursos">CURSOS</a>
                        `;
                    } else {
                        document.getElementById('form-pagamento-container').classList.remove('hidden');
                        document.getElementById('status-assinatura').innerHTML = '';
                        setTimeout(() => renderCheckout(user), 200);
                    }
                }
            } else {
                // SE NÃO ESTIVER LOGADO, MOSTRA O LOGIN E ESCONDE O RESTO
                authBox.classList.remove('hidden');
                paymentBox.classList.add('hidden');
                registerBox.classList.add('hidden');
            }
        });

        async function renderCheckout(currentUser) {
            if (paymentBrickController) {
                paymentBrickController.unmount();
            }

            const settings = {
                initialization: { amount: 50.00 },
                customization: { paymentMethods: { creditCard: "all", pix: "all" } },
                callbacks: {
                    onReady: () => {},
                    onSubmit: ({ formData }) => {
                        return new Promise((resolve, reject) => {
                            formData.transaction_amount = 50.00;
                            formData.metadata = { 
                                firebase_uid: currentUser.uid,
                                email_cadastro: currentUser.email 
                            }; 
                            
                            const feedbackEl = document.getElementById('feedback-processamento');
                            feedbackEl.className = 'status-msg';
                            feedbackEl.innerText = 'Pagamento aprovado! Processando e gravando status no banco...';
                            feedbackEl.classList.remove('hidden');

                            fetch('https://dglean.onrender.com/process_payment', {
                                method: 'POST', 
                                headers: { 'Content-Type': 'application/json' }, 
                                body: JSON.stringify(formData)
                            })
                            .then(res => res.json())
                            .then(async (data) => {
                                resolve();
                                if (data.status === 'approved') {
                                    feedbackEl.innerText = 'Status aprovado. Verificando sincronização com o Firebase...';
                                    
                                    let confirmado = false;
                                    for (let i = 0; i < 10; i++) {
                                        const checkDoc = await getDoc(doc(db, "usuarios", currentUser.uid));
                                        if (checkDoc.exists() && checkDoc.data().acesso_liberado === true) {
                                            confirmado = true;
                                            break;
                                        }
                                        await new Promise(r => setTimeout(r, 1000));
                                    }

                                    if (confirmado) {
                                        feedbackEl.innerText = 'Assinatura confirmada! Redirecionando...';
                                        setTimeout(() => window.location.href = "app.html", 1500);
                                    } else {
                                        feedbackEl.className = 'alert';
                                        feedbackEl.innerText = 'Pagamento aprovado, mas a sincronização demorou. Atualize a página.';
                                    }
                                } else {
                                    feedbackEl.classList.add('hidden');
                                    alert('Pagamento recusado: ' + (data.error || data.status_detail || 'Recusado'));
                                }
                            })
                            .catch(error => {
                                reject();
                                feedbackEl.classList.add('hidden');
                                alert("Erro de conexão com a API de pagamento.");
                            });
                        });
                    },
                    onError: (error) => {}
                }
            };
            paymentBrickController = await bricksBuilder.create('payment', 'paymentBrick_container', settings);
        }

        window.login = async () => {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            if(!email || !senha) return alert("Preencha os dados.");
            try { await signInWithEmailAndPassword(auth, email, senha); } catch (e) { alert("Credenciais inválidas."); }
        }

        window.mostrarCadastro = () => {
            document.getElementById('auth-box').classList.add('hidden');
            document.getElementById('register-box').classList.remove('hidden');
        }

        window.voltarLogin = () => {
            document.getElementById('register-box').classList.add('hidden');
            document.getElementById('auth-box').classList.remove('hidden');
        }

        window.cadastrarCompleto = async () => {
            const nome = document.getElementById('reg-nome').value;
            const email = document.getElementById('reg-email').value;
            const senha = document.getElementById('reg-senha').value;
            const cpf = document.getElementById('reg-cpf').value;
            const telefone = document.getElementById('reg-telefone').value;
            const endereco = document.getElementById('reg-endereco').value;

            if(!nome || !email || !senha || !cpf || !telefone || !endereco) {
                return alert("Preencha todos os campos do cadastro!");
            }

            try {
                const cred = await createUserWithEmailAndPassword(auth, email, senha);
                await setDoc(doc(db, "usuarios", cred.user.uid), { 
                    nome: nome,
                    email: email, 
                    cpf: cpf,
                    telefone: telefone,
                    endereco: endereco,
                    acesso_liberado: false, 
                    xp: 0, 
                    level: 1 
                });
                alert("Cadastro realizado com sucesso!");
                window.location.reload();
            } catch (e) { 
                alert("Erro ao criar conta: " + e.message); 
            }
        }

        window.logout = () => signOut(auth);
    </script>
</body>
</html>
