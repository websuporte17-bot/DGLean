<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG DEV HIGH SCHOOL | Teste Rosa</title>
    <!-- Importando a biblioteca oficial do Mercado Pago -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <style>
        /* TEMA ALTERADO PARA ROSA CONFORME PEDIDO PARA TESTE DE ATUALIZAÇÃO */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
        
        /* FUNDO TOTALMENTE ROSA */
        body { background: pink; color: #00ffcc; overflow-x: hidden; }
        
        .container { max-width: 800px; margin: 40px auto; padding: 20px; }
        
        /* Deixei as caixas escuras por cima do rosa pra você conseguir ler as letras */
        .box { background: #0a0a0a; padding: 30px; border: 1px solid #00ffcc; box-shadow: 0 0 15px rgba(0,0,0,0.5); margin-bottom: 20px; text-align: center; }
        
        .video-container { width: 100%; margin: 0 auto 20px; border: 2px solid #00ffcc; background: #000; }
        
        input, .btn { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 4px; outline: none; }
        input { background: #111; border: 1px solid #333; color: #00ffcc; }
        .btn { background: #000; color: #00ffcc; border: 1px solid #00ffcc; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        .btn:hover { background: #00ffcc; color: #050505; }
        
        .hidden { display: none !important; }
        .alert { color: #ff3366; border: 1px solid #ff3366; padding: 15px; margin-bottom: 15px; background: rgba(255,51,102,0.1); font-weight: bold; }
        /* simple spinner overlay */
        #spinnerOverlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); z-index: 9999; }
        #spinnerOverlay.visible { display: flex; }
        .spinner { border: 6px solid #f3f3f3; border-top: 6px solid #00ffcc; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* floating debug panel */
        #debugPanel { position: fixed; right: 12px; bottom: 12px; z-index: 10000; background: rgba(0,0,0,0.8); color: #00ffcc; border: 1px solid #00ffcc; padding: 8px; border-radius: 8px; font-size: 13px; }
        #debugPanel button { background: transparent; color: #00ffcc; border: 1px solid #00ffcc; padding: 6px 8px; margin: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <!-- VÍDEO DE INTRODUÇÃO -->
        <div class="video-container">
            <video src="COLOQUE_URL_DO_VÍDEO_AQUI.mp4" controls autoplay muted style="width: 100%; display: block;"></video>
        </div>

        <!-- TELA DE LOGIN / CADASTRO -->
        <div id="auth-box" class="box">
            <h2>Terminal DG Malvadão</h2>
            <br>
            <input type="email" id="email" placeholder="E-mail de Acesso">
            <input type="password" id="senha" placeholder="Chave de Segurança">
            <button class="btn" onclick="login()">Iniciar Sessão</button>
            <button class="btn" onclick="cadastrar()" style="border-color: #555; color: #aaa;">Registrar Nova Conta</button>
        </div>

        <!-- TELA DE COBRANÇA (Aparece se a conta estiver inativa) -->
        <div id="payment-box" class="box hidden">
            <div class="alert">CONTA INATIVA. Taxa de liberação: R$ 50,00.</div>
            <!-- O formulário do Mercado Pago vai renderizar aqui dentro -->
            <div id="paymentBrick_container"></div>
            <button class="btn" onclick="logout()" style="margin-top: 20px; border-color: #ff3366; color: #ff3366;">Desconectar</button>
        </div>
    </div>

    <div id="spinnerOverlay"><div class="spinner"></div></div>

    <div id="debugPanel">
        <div style="margin-bottom:6px; font-weight:bold;">Debug</div>
        <button id="downloadLogsBtn">Download Logs</button>
        <button id="sendLogsBtn">Enviar logs ao servidor</button>
        <button id="clearLogsBtn">Limpar logs</button>
    </div>

    <!-- SCRIPTS DE LÓGICA E FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA4qjeR-wbHmCtEGcnYN2FG4D9zR4xwQsU",
            authDomain: "proia-fff09.firebaseapp.com",
            projectId: "proia-fff09",
            storageBucket: "proia-fff09.firebasestorage.app",
            messagingSenderId: "1036426093065",
            appId: "1:1036426093065:web:be300aec12fafb486bced8"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        const mp = new MercadoPago('TEST-da788e0b-6fa3-43d1-9cfa-81128b766a2e', { locale: 'pt-BR' });
        const bricksBuilder = mp.bricks();
        let paymentBrickController;

        const spinner = document.getElementById('spinnerOverlay');
        function showSpinner() { spinner.classList.add('visible'); }
        function hideSpinner() { spinner.classList.remove('visible'); }

        // --- Client-side logger ---
        const LOG_KEY = 'dgcs_client_logs_v1';
        let logs = [];
        try {
            const raw = localStorage.getItem(LOG_KEY);
            if (raw) logs = JSON.parse(raw);
        } catch (e) { logs = []; }

        function pushLog(entry) {
            try {
                const item = Object.assign({ ts: new Date().toISOString() }, entry);
                logs.push(item);
                localStorage.setItem(LOG_KEY, JSON.stringify(logs));
                console.debug('[logger] ', item);
            } catch (e) { console.warn('logger err', e); }
        }

        // Intercept fetch to capture requests/responses
        (function(){
            const originalFetch = window.fetch.bind(window);
            window.fetch = async function(input, init) {
                const started = Date.now();
                let url = (typeof input === 'string') ? input : (input && input.url) || 'unknown';
                pushLog({ type: 'fetch_start', url, init: (init && { method: init.method }) || null });
                try {
                    const resp = await originalFetch(input, init);
                    const text = await resp.clone().text().catch(()=>'<non-text>');
                    pushLog({ type: 'fetch_end', url, status: resp.status, duration_ms: Date.now() - started, body_preview: text.slice(0,1000) });
                    return resp;
                } catch (err) {
                    pushLog({ type: 'fetch_error', url, error: (err && err.message) || String(err) });
                    throw err;
                }
            };
        })();

        // Capture unhandled errors and promise rejections
        window.addEventListener('error', (ev) => {
            pushLog({ type: 'window_error', message: ev.message, filename: ev.filename, lineno: ev.lineno, colno: ev.colno });
        });
        window.addEventListener('unhandledrejection', (ev) => {
            pushLog({ type: 'unhandledrejection', reason: ev.reason && (ev.reason.message || JSON.stringify(ev.reason)) });
        });

        // Debug panel buttons
        document.getElementById('downloadLogsBtn').addEventListener('click', () => {
            const blob = new Blob([JSON.stringify({ exported_at: new Date().toISOString(), logs }, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'dgcs_client_logs.json';
            document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
        });

        document.getElementById('clearLogsBtn').addEventListener('click', () => {
            logs = []; localStorage.removeItem(LOG_KEY); alert('Logs limpos localmente');
        });

        document.getElementById('sendLogsBtn').addEventListener('click', async () => {
            try {
                const resp = await fetch('/client_logs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: location.href, logs }) });
                const data = await resp.json();
                if (resp.ok) alert('Logs enviados ao servidor: ' + (data.filename || 'ok'));
                else alert('Erro enviando logs: ' + JSON.stringify(data));
            } catch (err) {
                alert('Erro enviando logs: ' + err.message);
            }
        });

        // Push some initial info
        pushLog({ type: 'page_load', href: location.href, userAgent: navigator.userAgent });

        // --- End logger ---

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('auth-box').classList.add('hidden');
                const docSnap = await getDoc(doc(db, "usuarios", user.uid));
                
                if (docSnap.exists() && docSnap.data().acesso_liberado) {
                    window.location.href = "app.html";
                } else {
                    document.getElementById('payment-box').classList.remove('hidden');
                    
                    // ATRASO DE 200ms PARA NÃO TRAVAR O MERCADO PAGO
                    setTimeout(() => {
                        renderCheckout(user.uid);
                    }, 200);
                }
            } else {
                document.getElementById('auth-box').classList.remove('hidden');
                document.getElementById('payment-box').classList.add('hidden');
            }
        });

        async function renderCheckout(uid) {
            if (paymentBrickController) {
                try { paymentBrickController.unmount(); } catch (e) { console.warn('unmount erro', e); }
            }

            const settings = {
                initialization: { 
                    amount: 50.00 
                },
                customization: { 
                    paymentMethods: { creditCard: "all", pix: "all" } 
                },
                callbacks: {
                    onReady: () => {
                        console.log('Formulário do Mercado Pago destravado e carregado!');
                        pushLog({ type: 'mp_onReady' });
                    },
                    onSubmit: async ({ formData }) => {
                        // attach uid for server-side mapping
                        formData.metadata = { firebase_uid: uid };
                        console.log('onSubmit formData:', formData);
                        pushLog({ type: 'mp_onSubmit', formData_preview: JSON.stringify(formData).slice(0,1000) });

                        showSpinner();
                        try {
                            const resp = await fetch('https://dglean.onrender.com/process_payment', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(formData)
                            });

                            const text = await resp.text();
                            let data;
                            try { data = JSON.parse(text); } catch (e) {
                                throw new Error('Resposta inválida do servidor: ' + text);
                            }

                            if (!resp.ok) {
                                throw new Error(data?.error || JSON.stringify(data));
                            }

                            console.log('process_payment response:', data);
                            pushLog({ type: 'process_payment_response', data_preview: JSON.stringify(data).slice(0,1000) });

                            if (data.status === 'approved') {
                                alert('Pagamento Aprovado! O sistema está liberando seu acesso...');
                                setTimeout(() => window.location.reload(), 3000);
                            } else {
                                alert('Pagamento não aprovado: ' + (data.status_detail || JSON.stringify(data)));
                            }
                        } catch (err) {
                            console.error('Erro de conexão ou processamento:', err);
                            pushLog({ type: 'process_payment_error', error: err.message });
                            alert('Erro ao processar pagamento: ' + err.message);
                        } finally {
                            hideSpinner();
                        }
                    },
                    onError: (error) => {
                        console.error('Erro no Brick:', error);
                        pushLog({ type: 'mp_onError', error: (error && error.message) || JSON.stringify(error) });
                        alert('Erro no componente de pagamento: ' + (error?.message || JSON.stringify(error)));
                    }
                }
            };
            
            paymentBrickController = await bricksBuilder.create('payment', 'paymentBrick_container', settings);
        }

        window.login = async () => {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            if(!email || !senha) return alert('Preencha os dados.');
            try { 
                await signInWithEmailAndPassword(auth, email, senha); 
            } catch (e) { 
                alert('Credenciais inválidas.'); 
            }
        }

        window.cadastrar = async () => {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            if(!email || !senha) return alert('Preencha os dados.');
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, senha);
                await setDoc(doc(db, 'usuarios', cred.user.uid), { 
                    email: email, 
                    acesso_liberado: false, 
                    xp: 0, 
                    level: 1 
                });
            } catch (e) { 
                alert('Erro ao criar conta: ' + e.message); 
            }
        }

        window.logout = () => signOut(auth);
    </script>
</body>
</html>
