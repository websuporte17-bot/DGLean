<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DG DEV HIGH SCHOOL | Cyberpunk 2026</title>
    <!-- Importando a biblioteca oficial do Mercado Pago -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <style>
        /* TEMA CYBERPUNK DARKWEB */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Courier New', monospace; }
        body { background: #050505; color: #00ffcc; overflow-x: hidden; }
        body::before { 
            content: ""; position: fixed; width: 100%; height: 100%; 
            background: linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px); 
            background-size: 30px 30px; z-index: -1; 
        }
        .container { max-width: 800px; margin: 40px auto; padding: 20px; }
        .box { background: #0a0a0a; padding: 30px; border: 1px solid #00ffcc; box-shadow: 0 0 15px rgba(0,255,204,0.15); margin-bottom: 20px; text-align: center; }
        
        .video-container { width: 100%; margin: 0 auto 20px; border: 2px solid #00ffcc; background: #000; }
        
        input, .btn { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 4px; outline: none; }
        input { background: #111; border: 1px solid #333; color: #00ffcc; }
        .btn { background: transparent; color: #00ffcc; border: 1px solid #00ffcc; cursor: pointer; text-transform: uppercase; font-weight: bold; }
        .btn:hover { background: #00ffcc; color: #050505; }
        
        .hidden { display: none !important; }
        .alert { color: #ff3366; border: 1px solid #ff3366; padding: 15px; margin-bottom: 15px; background: rgba(255,51,102,0.1); }
    </style>
</head>
<body>
    <div class="container">
        <!-- VÍDEO DE INTRODUÇÃO -->
        <div class="video-container">
            <video src="COLOQUE_URL_DO_VÍDEO_AQUI.mp4" controls autoplay muted style="width: 100%; display: block;"></video>
        </div>

        <!-- TELA DE LOGIN / CADASTRO -->
        <div id="auth-box" class="box">
            <h2>Terminal DG Malvadão</h2>
            <br>
            <input type="email" id="email" placeholder="E-mail de Acesso">
            <input type="password" id="senha" placeholder="Chave de Segurança">
            <button class="btn" onclick="login()">Iniciar Sessão</button>
            <button class="btn" onclick="cadastrar()" style="border-color: #555; color: #aaa;">Registrar Nova Conta</button>
        </div>

        <!-- TELA DE COBRANÇA (Aparece se a conta estiver inativa) -->
        <div id="payment-box" class="box hidden">
            <div class="alert">CONTA INATIVA. Taxa de liberação: R$ 50,00.</div>
            <!-- O formulário do Mercado Pago vai renderizar aqui dentro -->
            <div id="paymentBrick_container"></div>
            <button class="btn" onclick="logout()" style="margin-top: 20px; border-color: #ff3366; color: #ff3366;">Desconectar</button>
        </div>
    </div>

    <!-- SCRIPTS DE LÓGICA E FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        // SUAS CHAVES ORIGINAIS DO FIREBASE[span_0](start_span)[span_0](end_span)
        const firebaseConfig = {
            apiKey: "AIzaSyA4qjeR-wbHmCtEGcnYN2FG4D9zR4xwQsU",
            authDomain: "proia-fff09.firebaseapp.com",
            projectId: "proia-fff09",
            storageBucket: "proia-fff09.firebasestorage.app",
            messagingSenderId: "1036426093065",
            appId: "1:1036426093065:web:be300aec12fafb486bced8"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // SUA CHAVE ORIGINAL DO MERCADO PAGO DE TESTE[span_1](start_span)[span_1](end_span)[span_2](start_span)[span_2](end_span)
        const mp = new MercadoPago('TEST-da788e0b-6fa3-43d1-9cfa-81128b766a2e', { locale: 'pt-BR' });

        // CONTROLE DE TELAS
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('auth-box').classList.add('hidden');
                const docSnap = await getDoc(doc(db, "usuarios", user.uid));
                
                if (docSnap.exists() && docSnap.data().acesso_liberado) {
                    // JÁ PAGOU: Manda direto pra plataforma
                    window.location.href = "app.html";
                } else {
                    // NÃO PAGOU: Mostra o Brick do Mercado Pago
                    document.getElementById('payment-box').classList.remove('hidden');
                    renderCheckout(user.uid);
                }
            } else {
                // NÃO LOGADO: Mostra login
                document.getElementById('auth-box').classList.remove('hidden');
                document.getElementById('payment-box').classList.add('hidden');
            }
        });

        // GERA O FORMULÁRIO DE PAGAMENTO (Corrigido para não travar no modo teste)
        async function renderCheckout(uid) {
            const settings = {
                initialization: { 
                    amount: 50.00 
                },
                customization: { 
                    paymentMethods: { creditCard: "all", pix: "all" } 
                },
                callbacks: {
                    onSubmit: ({ formData }) => {
                        // Injeta silenciosamente o UID para o Render saber quem pagou
                        formData.metadata = { firebase_uid: uid }; 
                        
                        // USA SUA API ORIGINAL DO RENDER[span_3](start_span)[span_3](end_span)[span_4](start_span)[span_4](end_span)
                        return fetch('https://dglean.onrender.com/process_payment', {
                            method: 'POST', 
                            headers: { 'Content-Type': 'application/json' }, 
                            body: JSON.stringify(formData)
                        }).then(res => res.json()).then(data => {
                            if (data.status === 'approved') {
                                alert('Pagamento Aprovado! O sistema está liberando seu acesso...');
                                setTimeout(() => window.location.reload(), 4000); 
                            } else {
                                alert('Pagamento não aprovado: ' + data.status_detail);
                            }
                        });
                    }
                }
            };
            await mp.bricks().create('payment', 'paymentBrick_container', settings);
        }

        // FUNÇÕES DE BOTÃO
        window.login = async () => {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            if(!email || !senha) return alert("Preencha os dados.");
            try { 
                await signInWithEmailAndPassword(auth, email, senha); 
            } catch (e) { 
                alert("Credenciais inválidas."); 
            }
        }

        window.cadastrar = async () => {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            if(!email || !senha) return alert("Preencha os dados para registrar.");
            try {
                const cred = await createUserWithEmailAndPassword(auth, email, senha);
                // Cria o perfil do aluno zerado
                await setDoc(doc(db, "usuarios", cred.user.uid), { 
                    email: email, 
                    acesso_liberado: false, 
                    xp: 0, 
                    level: 1 
                });
            } catch (e) { 
                alert("Erro ao criar conta: " + e.message); 
            }
        }

        window.logout = () => signOut(auth);
    </script>
</body>
</html>
